{% extends 'base.html' %}
{% block content %}

<style>
  .custom-card {
    border-radius: 12px;
    border: none;
    background-color: #ffffff;
  }
  .custom-btn {
    background-color: #438f63;
    border: none;
    padding: 10px;
    font-size: 16px;
    font-weight: 500;
  }
  .custom-btn:hover {
    background-color: #35704d;
  }
  .form-group label {
    font-weight: 500;
    color: #444;
  }
</style>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <h4 class="text-center alert alert-info shadow-sm" style="border-radius: 8px;">Add New Student</h4>
            
            <form method="post" enctype="multipart/form-data" class="card shadow-lg p-4 custom-card">
                {% csrf_token %}

                <div class="form-row">
                  <div class="form-group col-md-6">
                    <label for="name">Name</label>
                    <input type="text" name="name" class="form-control" id="name" placeholder="Name">
                  </div>
                  <div class="form-group col-md-6">
                    <label for="age">Age</label>
                    <input type="number" name="age" class="form-control" id="age" placeholder="Age">
                  </div>
                </div>

                <div class="form-group">
                  <label for="address">Address</label>
                  <input type="text" name="address" class="form-control" id="address" placeholder="1234 Main St">
                </div>

                <div class="form-group">
                  <label for="phone_number">Phone number</label>
                  <input type="number" name="phone_number" class="form-control" id="phone_number" placeholder="Phone number">
                </div>

                <div class="form-group">
                  <label for="image">Image</label>
                  <input type="file" name="student_image" class="form-control" style="padding: 3px;" id="image">
                </div>

                <button type="submit" class="btn btn-success btn-block custom-btn mt-3">Add Student</button>
            </form>

        </div>
    </div>
</div>

{% endblock content %}
