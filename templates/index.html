<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<style>


        body {
            margin: 10px;
            padding: 20px;
            background-color: #ffffff;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }



       
        .content-wrapper {
            display: flex;
            gap: 40px;
        }

        .left-column {
            flex: 1;
        }

        .right-column {
            flex: 2;
        }

       
        .section-title {
            background-color: #d8f3f8;
            color: #2b7a8c;
            text-align: center;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            margin-bottom: 20px;
        }

  
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; 
        }

        .btn-add {
            background-color: #438f63;
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-edit {
            background-color: #eebb4d;
            color: white;
            border: none;
            padding: 5px 15px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            width: 70px;
        }

        .btn-delete {
            background-color: #cb535a;
            color: white;
            border: none;
            padding: 5px 15px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            width: 70px;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead th {
            text-align: left;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
            color: #333;
        }

        tbody td {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            color: #555;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }
</style>
<body>

<div class="container">


    <div class="content-wrapper">
        <div class="left-column">
            <div class="section-title">
                Add New student
            </div>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name">
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password">
                </div>
                
                <button type="button" class="btn-add">Add</button>
            </form>
        </div>

        <div class="right-column">
            <div class="section-title">
                Show Student Infromation 
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Password</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td class="action-buttons">
                            <button class="btn-edit">Edit</button>
                            <button class="btn-delete">delete</button>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td class="action-buttons">
                            <button class="btn-edit">Edit</button>
                            <button class="btn-delete">delete</button>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td class="action-buttons">
                            <button class="btn-edit">Edit</button>
                            <button class="btn-delete">delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>


</body>
</html>
